name: Hermes Agent over Tailscale (Experimental)
on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Session length in minutes, maximum 310
        required: true
        type: number
        default: 300
  push:
    paths:
      - .github/workflows/hermes-agent.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: hermes-fast-v2
  # Supersede stale experimental starts when a corrected workflow is pushed.
  cancel-in-progress: true

jobs:
  hermes:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify PowerShell scripts
        shell: powershell
        run: |
          $files = @("scripts\hermes-bootstrap.ps1", "scripts\hermes-fast-server.ps1")
          foreach ($file in $files) {
            $data = [IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            if (@($data | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "PowerShell file has non-ASCII punctuation that Windows PowerShell 5.1 may misparse: $file"
            }
            $tok = $null
            $err = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tok, [ref]$err)
            if ($err.Count -gt 0) { throw "PowerShell script syntax invalid: $file" }
          }
          Write-Host "Hermes scripts pass syntax preflight."

      - name: Restore cached clean Hermes, Ollama and model
        id: runtime_cache
        uses: actions/cache/restore@v4
        with:
          key: hermes-windows2022-pinned79b45d-qwen35-2b-v1
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models

      - name: Prepare only public binaries and standard model
        shell: powershell
        run: |
          & .\scripts\hermes-bootstrap.ps1
          if (-not $?) { throw "Hermes clean runtime preparation failed" }

      - name: Cache only clean binaries and model BEFORE any private data
        if: steps.runtime_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: hermes-windows2022-pinned79b45d-qwen35-2b-v1
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models

      - name: Install snapshot encryption and validate restore
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check cryptography
          if ($LASTEXITCODE -ne 0) { throw "Snapshot encryption library failed" }
          python scripts/hermes_persist.py selftest
          if ($LASTEXITCODE -ne 0) { throw "Encrypted snapshot test failed" }

      - name: Locate latest previous encrypted state
        id: snapshot
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $data = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to list backups" }
          $latest = $data.artifacts | Where-Object {
            $_.name -like "hermes-state-*" -and $_.expired -eq $false -and
            $_.workflow_run.head_branch -eq "main" -and
            $_.workflow_run.id -ne [long]$env:GITHUB_RUN_ID
          } | Sort-Object created_at -Descending | Select-Object -First 1
          if ($latest) {
            "name=$($latest.name)" >> $env:GITHUB_OUTPUT
            "run_id=$($latest.workflow_run.id)" >> $env:GITHUB_OUTPUT
            Write-Host "Found encrypted state from an earlier run."
          } else {
            Write-Host "No encrypted Hermes history yet; fresh start."
          }

      - name: Download encrypted session backup
        if: steps.snapshot.outputs.name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.snapshot.outputs.name }}
          run-id: ${{ steps.snapshot.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hermes-restore

      - name: Restore private memory, sessions and work files
        if: steps.snapshot.outputs.name != ''
        shell: powershell
        env:
          HERMES_DASHBOARD_PASSWORD: ${{ secrets.HERMES_DASHBOARD_PASSWORD }}
        run: |
          python scripts/hermes_persist.py restore --home "$env:RUNNER_TEMP\hermes" --workspace "$env:RUNNER_TEMP\HermesWorkspace" --file "$env:RUNNER_TEMP\hermes-restore\hermes-state.enc"
          if ($LASTEXITCODE -ne 0) { throw "Encrypted memory restore failed; backup may use a different password" }

      - name: Authenticate private Tailscale connection
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if (-not $env:TS_AUTHKEY) { throw "Configure TAILSCALE_AUTHKEY secret" }
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          $proc = Start-Process msiexec.exe -ArgumentList @("/i", $msi, "/quiet", "/norestart") -Wait -PassThru
          if ($proc.ExitCode -notin @(0,3010)) { throw "Tailscale installation failed" }
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="hermes-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) { throw "Tailscale auth failed" }
          $ip = (& $ts ip -4 | Select-Object -First 1)
          if (-not $ip -or $ip -notmatch '^100\.') { throw "Tailscale private IP missing" }
          Write-Host "::add-mask::$ip"
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Joined private Tailscale network."

      - name: Run authenticated Hermes dashboard and encrypted backups
        timeout-minutes: 330
        shell: powershell
        env:
          HERMES_DASHBOARD_PASSWORD: ${{ secrets.HERMES_DASHBOARD_PASSWORD }}
          HERMES_SESSION_MINUTES: ${{ github.event_name == 'push' && '2' || inputs.session_minutes }}
        run: |
          & .\scripts\hermes-fast-server.ps1
          if (-not $?) { throw "Hermes dashboard ended with an error" }

      - name: Upload encrypted memory checkpoint after session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-state-${{ github.run_id }}
          path: ${{ runner.temp }}/hermes-state.enc
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
