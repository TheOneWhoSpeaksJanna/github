
name: Windows RDP + Tailscale + Ollama AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-vm:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Setup RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Enable RDP
          $base = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $rdp = "$base\WinStations\RDP-Tcp"

          Set-ItemProperty -Path $base `
            -Name fDenyTSConnections -Value 0

          # Keep authentication protections enabled
          Set-ItemProperty -Path $rdp `
            -Name UserAuthentication -Value 1

          Set-ItemProperty -Path $rdp `
            -Name SecurityLayer -Value 2

          # Disable general RDP firewall access
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Permit RDP only through the Tailscale adapter
          New-NetFirewallRule `
            -DisplayName "RDP over Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -InterfaceAlias "Tailscale" `
            -ErrorAction Stop

          # Create user with random password
          $bytes = New-Object byte[] 24
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $rng.Dispose()

          $password = "Ai!" + [Convert]::ToBase64String($bytes)
          $secure = ConvertTo-SecureString `
            $password -AsPlainText -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $secure `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP account configured!"

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Download current official MSI
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $file

          $p = Start-Process msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait -PassThru

          if ($p.ExitCode -notin @(0,3010)) {
            throw "Tailscale installation failed"
          }

          Write-Host "Tailscale installed!"

      - name: Login To Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "===================================="
          Write-Host "OPEN THE TAILSCALE LOGIN URL BELOW"
          Write-Host "===================================="

          # Interactive authentication
          & $ts up `
            --hostname="ai-vm-$env:GITHUB_RUN_ID" `
            --unattended

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale login failed"
          }

          $ip = $null

          for ($i = 0; $i -lt 30; $i++) {
            $ip = (& $ts ip -4 | Select-Object -First 1)

            if ($ip) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $ip) {
            throw "No Tailscale IP"
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected!"
          Write-Host "IP: $ip"

      - name: Install Ollama and Run AI Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          # Display access information
          Write-Host ""
          Write-Host "=================================="
          Write-Host "        YOUR WINDOWS VM"
          Write-Host "=================================="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=================================="
          Write-Host ""

          # Optimize for 8GB RAM
          $env:CUDA_VISIBLE_DEVICES = "-1"
          $env:OLLAMA_NUM_PARALLEL = "1"
          $env:OLLAMA_MAX_LOADED_MODELS = "1"
          $env:OLLAMA_CONTEXT_LENGTH = "2048"
          $env:OLLAMA_HOST = "127.0.0.1:11434"

          # Persist settings for the RDP user
          $settings = @{
            CUDA_VISIBLE_DEVICES = "-1"
            OLLAMA_NUM_PARALLEL = "1"
            OLLAMA_MAX_LOADED_MODELS = "1"
            OLLAMA_CONTEXT_LENGTH = "2048"
            OLLAMA_HOST = "127.0.0.1:11434"
          }

          foreach ($key in $settings.Keys) {
            [Environment]::SetEnvironmentVariable(
              $key, $settings[$key], "Machine"
            )
          }

          Write-Host "Installing Ollama..."

          # Official PowerShell installer
          irm https://ollama.com/install.ps1 | iex

          # Locate executable
          $paths = @(
            "$env:LOCALAPPDATA\Programs\Ollama\ollama.exe",
            "$env:ProgramFiles\Ollama\ollama.exe"
          )

          $found = Get-Command ollama.exe `
            -ErrorAction SilentlyContinue

          if ($found) {
            $paths += $found.Source
          }

          $ollama = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $ollama) {
            throw "Ollama executable not found"
          }

          Write-Host "Ollama executable: $ollama"

          # Start local server if necessary
          $ready = $false

          try {
            Invoke-RestMethod `
              -Uri "http://127.0.0.1:11434/api/tags" `
              -TimeoutSec 3 | Out-Null

            $ready = $true
          }
          catch {}

          if (-not $ready) {
            Start-Process `
              -FilePath $ollama `
              -ArgumentList "serve" `
              -WindowStyle Hidden
          }

          # Wait for server
          $ready = $false

          for ($i = 0; $i -lt 60; $i++) {
            try {
              Invoke-RestMethod `
                -Uri "http://127.0.0.1:11434/api/tags" `
                -TimeoutSec 3 | Out-Null

              $ready = $true
              break
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ready) {
            throw "Ollama server failed to start"
          }

          Write-Host "Ollama server ready!"

          # Download local 4B model
          $model = "qwen3:4b"

          Write-Host "Downloading $model..."

          & $ollama pull $model

          if ($LASTEXITCODE -ne 0) {
            throw "Model download failed"
          }

          # Verify installation
          & $ollama list

          if ($LASTEXITCODE -ne 0) {
            throw "Model verification failed"
          }

          Write-Host ""
          Write-Host "=================================="
          Write-Host "           AI IS READY"
          Write-Host "=================================="
          Write-Host "Model: $model"
          Write-Host "Ollama: $ollama"
          Write-Host "API: http://127.0.0.1:11434"
          Write-Host ""
          Write-Host "Run in VM PowerShell:"
          Write-Host "& '$ollama' run $model"
          Write-Host "=================================="

          # Keep GitHub runner active
          while ($true) {
            Start-Sleep -Seconds 300
            Write-Host "VM and Ollama session active"
          }
