name: Android Ollama over Tailscale
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/main.yml
permissions:
  contents: read
concurrency:
  group: android-ollama-server
  cancel-in-progress: true
jobs:
  ai-vm:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Verify public runner CPU and memory
        shell: powershell
        run: |
          $logical = [Environment]::ProcessorCount
          $total = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          Write-Host "RUNNER CPUs: $logical; RAM: $total GB"
          "## Public Actions hardware: $logical logical CPU cores; $total GB RAM" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if ($logical -lt 4) { Write-Warning "Runner has fewer than the expected four logical CPUs" }
      - name: Install and authenticate Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if (-not $env:TS_AUTHKEY) { throw "Missing GitHub repository secret TAILSCALE_AUTHKEY" }
          $file = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $file
          $installer = Start-Process msiexec.exe -ArgumentList @("/i", $file, "/quiet", "/norestart") -Wait -PassThru
          if ($installer.ExitCode -notin @(0,3010)) { throw "Tailscale installation failed" }
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="ollama-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) { throw "Tailscale authentication failed" }
          $ip = (& $ts ip -4 | Select-Object -First 1)
          if (-not $ip -or $ip -notmatch '^100\.') { throw "Missing Tailscale IP" }
          # Public repository job logs are visible to everyone. Mask tailnet addresses.
          Write-Host "::add-mask::$ip"
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Connected to private Tailscale network"

      - name: Install Ollama in shared directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $settings = @{
            CUDA_VISIBLE_DEVICES="-1"
            HIP_VISIBLE_DEVICES="-1"
            OLLAMA_NUM_PARALLEL="1"
            OLLAMA_MAX_LOADED_MODELS="1"
            OLLAMA_CONTEXT_LENGTH="2048"
            OLLAMA_KEEP_ALIVE="30m"
            OLLAMA_HOST="$($env:TAILSCALE_IP):11434"
            OLLAMA_MODELS="C:\AI\Models"
          }
          foreach ($key in $settings.Keys) {
            [Environment]::SetEnvironmentVariable($key,$settings[$key],"Machine")
            Set-Item -Path "Env:$key" -Value $settings[$key]
          }
          irm https://ollama.com/install.ps1 | iex
          $sources = @("$env:LOCALAPPDATA\Programs\Ollama","$env:ProgramFiles\Ollama")
          $source = $sources | Where-Object { Test-Path (Join-Path $_ "ollama.exe") } | Select-Object -First 1
          if (-not $source) { throw "Ollama installation missing" }
          New-Item -ItemType Directory "C:\Ollama" -Force | Out-Null
          Copy-Item "$source\*" "C:\Ollama" -Recurse -Force
          New-Item -ItemType Directory "C:\AI\Models" -Force | Out-Null
          $ollama = "C:\Ollama\ollama.exe"
          if (-not (Test-Path $ollama)) { throw "Shared executable missing" }
          Get-Process -Name "ollama" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $adapter = Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -eq $env:TAILSCALE_IP } | Select-Object -First 1
          if (-not $adapter) { throw "Tailscale adapter missing" }
          New-NetFirewallRule -DisplayName "AI API via Tailscale" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 11434 -InterfaceAlias $adapter.InterfaceAlias -RemoteAddress "100.64.0.0/10" -ErrorAction Stop | Out-Null

          # Keep CPU threading automatic. Earlier tuning results came from a
          # different 2-vCPU runner and standard models, not this 4-vCPU VM.
          # Explicit LLAMA_ARG_THREADS is not a reliable Ollama tuning mechanism.
          Remove-Item Env:LLAMA_ARG_THREADS -ErrorAction SilentlyContinue
          Write-Host "Using Ollama's automatic CPU thread selection."

          Start-Process -FilePath $ollama -ArgumentList "serve" -WindowStyle Hidden
          $api = "http://$($env:TAILSCALE_IP):11434"
          $ready = $false
          for ($i=0; $i -lt 60; $i++) {
            try {
              Invoke-RestMethod "$api/api/tags" -TimeoutSec 3 | Out-Null
              $ready = $true
              break
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { throw "Ollama server did not start" }
          # MODEL SELECTION: edit selected-model.txt in the repository.
          $model = "qwen2.5-coder:1.5b"
          if (Test-Path "selected-model.txt") {
            $value = (Get-Content "selected-model.txt" -Raw).Trim()
            if ($value -and $value -ne "PUT THE MODEL HERE") {
              if ($value -notmatch '^[a-zA-Z0-9_.:/-]+$') {
                throw "Invalid model identifier in selected-model.txt"
              }
              $model = $value
            }
          }
          & $ollama pull $model
          if ($LASTEXITCODE -ne 0) { throw "Model pull failed: $model" }

          # Create a clearly identified, concise chat profile.
          # A prompt cannot give the model web browsing or upload capabilities.
          $profile = Join-Path $env:TEMP "Modelfile"
          @"
          FROM $model
          PARAMETER num_ctx 2048
          PARAMETER num_predict 256
          PARAMETER temperature 0.2
          SYSTEM """
          You are a local coding assistant powered by the Ollama model $model, not ChatGPT or an OpenAI model.
          When asked your identity, name the actual underlying model accurately.
          Be concise unless the user requests a detailed explanation.
          Do not claim to have searched websites, uploaded images, used a terminal, or executed tools unless the connected app actually performed those actions.
          If the request requires unavailable tools, say which capability is missing.
          """
          "@ | Set-Content -Path $profile -Encoding UTF8
          & $ollama create local-coder -f $profile
          if ($LASTEXITCODE -ne 0) { throw "Could not create chat profile" }
          
          # Tiny warm-up, keeping the model in memory for a quicker first message.
          $request = @{
            model = "local-coder"
            prompt = "Reply with OK."
            stream = $false
            keep_alive = "30m"
            options = @{ num_predict = 8; num_ctx = 2048 }
          } | ConvertTo-Json -Depth 5
          try {
            $warmup = Invoke-RestMethod -Uri "$api/api/generate" -Method Post -ContentType "application/json" -Body $request -TimeoutSec 120
            Write-Host "Warm-up generation: $([math]::Round($warmup.eval_count / [math]::Max($warmup.eval_duration / 1e9,0.001),1)) tokens/sec"
          } catch { Write-Host "Warm-up failed: $($_.Exception.Message)" }
          
          Write-Host "========================================"
          Write-Host "ANDROID APP SERVER: available privately via Tailscale, port 11434"
          Write-Host "Find this run's Tailscale IP in your Tailscale devices dashboard."
          Write-Host "MODEL: local-coder (based on $model)"
          Write-Host "Ollama executable: C:\Ollama\ollama.exe"
          Write-Host "========================================"
          while ($true) {
            Start-Sleep -Seconds 300
            if (-not (Get-Process ollama -ErrorAction SilentlyContinue)) { throw "Ollama stopped" }
            Write-Host "Ollama API running"
          }
