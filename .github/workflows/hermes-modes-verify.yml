name: Verify Hermes lightweight launch modes
on:
  push:
    paths:
      - .github/workflows/hermes-modes-verify.yml
permissions:
  contents: read
jobs:
  test-modes:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore public Hermes installation cache
        uses: actions/cache/restore@v4
        with:
          key: hermes-win2022-pinned79b45d-mobile-v3-${{ hashFiles('hermes-models.txt') }}
          restore-keys: |
            hermes-win2022-pinned79b45d-mobile-v3-
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models
      - name: Prepare public Hermes binaries and models
        shell: powershell
        run: |
          & .\scripts\hermes-bootstrap.ps1
          if (-not $?) { throw "Hermes runtime missing" }
      - name: Test chat-only, file-only and full agent profile configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP "hermes"
          $hermes = Join-Path $env:HERMES_HOME "bin\hermes.exe"
          $psfile = "scripts\hermes-mode-config.ps1"
          $tok = $null
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $psfile).Path,[ref]$tok,[ref]$errs)
          if ($errs.Count -gt 0) { throw "Invalid mode script PowerShell syntax" }
          foreach ($mode in @("chat","light","full")) {
            & .\scripts\hermes-mode-config.ps1 -HermesExe $hermes -Mode $mode
            if (-not $?) { throw "Could not set Hermes profile $mode" }
            $result = & $hermes config get platform_toolsets.cli
            if ($LASTEXITCODE -ne 0) { throw "Hermes config could not read $mode profile" }
            Write-Host "Verified Hermes mode $mode. Stored toolsets: $($result -join ' ')"
          }
          Write-Host "PASSED: all 3 Hermes CPU launch mode configurations stored and read correctly."
