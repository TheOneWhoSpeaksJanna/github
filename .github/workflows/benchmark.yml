name: Benchmark 20 coding models
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: windows-2022
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama for benchmarking
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $env:OLLAMA_MODELS = "C:\AI\Models"
          $env:OLLAMA_HOST = "127.0.0.1:11434"
          $env:OLLAMA_NUM_PARALLEL = "1"
          $env:OLLAMA_MAX_LOADED_MODELS = "1"
          $env:OLLAMA_CONTEXT_LENGTH = "1024"
          New-Item -ItemType Directory -Path "C:\AI\Models" -Force | Out-Null
          irm https://ollama.com/install.ps1 | iex
          $paths = @("$env:LOCALAPPDATA\Programs\Ollama","$env:ProgramFiles\Ollama")
          $source = $paths | Where-Object { Test-Path (Join-Path $_ "ollama.exe") } | Select-Object -First 1
          if (-not $source) { throw "Ollama executable missing" }
          New-Item -ItemType Directory -Path "C:\Ollama" -Force | Out-Null
          Copy-Item "$source\*" "C:\Ollama" -Recurse -Force
          Get-Process ollama -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process "C:\Ollama\ollama.exe" -ArgumentList "serve" -WindowStyle Hidden
          $ready = $false
          for ($i=0; $i -lt 60; $i++) {
            try {
              Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 3 | Out-Null
              $ready = $true
              break
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { throw "Ollama not ready" }
      - name: Benchmark 20 small models
        shell: powershell
        run: |
          python benchmark_models.py
      - name: Commit benchmark Markdown and optional winner
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path "MODEL_BENCHMARK.md")) { throw "Benchmark produced no report" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODEL_BENCHMARK.md
          if (Test-Path "selected-model.txt") { git add selected-model.txt }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No report changes"
            exit 0
          }
          git commit -m "Record coding model benchmark and selected model"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push origin "HEAD:main"
          if ($LASTEXITCODE -ne 0) { throw "Push failed; check branch protection and write permissions" }
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-model-benchmark
          path: MODEL_BENCHMARK.md
          if-no-files-found: ignore
