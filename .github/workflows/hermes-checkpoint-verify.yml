name: Verify Hermes safe encrypted checkpoints
on:
  push:
    paths:
      - .github/workflows/hermes-checkpoint-verify.yml
permissions:
  contents: write
  actions: read
jobs:
  checkpoint-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkpoint script syntax and encrypted upload/restore
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts\hermes-checkpoint.ps1").Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "PARSE ERROR: $($_.Message) at $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber)" }
            throw "Checkpoint script parsing failed"
          }
          $encryptedFile = Join-Path $env:RUNNER_TEMP "fake-encrypted-checkpoint.enc"
          # Synthetic encrypted-looking bytes: no conversation, credentials or files.
          $randomBytes = New-Object byte[] 16384
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($randomBytes)
          $rng.Dispose()
          [IO.File]::WriteAllBytes($encryptedFile, $randomBytes)
          & .\scripts\hermes-checkpoint.ps1 -EncryptedFile $encryptedFile -Repository $env:GITHUB_REPOSITORY -RunId $env:GITHUB_RUN_ID -Tag "hermes-checkpoint-smoketest"
          if (-not $?) { throw "Could not upload encrypted test checkpoint" }
          $release = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/hermes-checkpoint-smoketest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Release lookup failed" }
          $asset = $release.assets | Where-Object { $_.name -like "hermes-state-*.enc" } | Sort-Object created_at -Descending | Select-Object -First 1
          if (-not $asset) { throw "Encrypted backup was not published off-VM" }
          $dest = Join-Path $env:RUNNER_TEMP "checkpoint-verify"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & gh release download "hermes-checkpoint-smoketest" --repo $env:GITHUB_REPOSITORY --pattern $asset.name --dir $dest
          if ($LASTEXITCODE -ne 0) { throw "Could not restore rolling release checkpoint" }
          $gotHash = (Get-FileHash (Join-Path $dest $asset.name) -Algorithm SHA256).Hash
          $wantHash = (Get-FileHash $encryptedFile -Algorithm SHA256).Hash
          if ($gotHash -ne $wantHash) { throw "Checkpoint upload/download corrupted encrypted ciphertext" }
          Write-Host "PASSED: checkpoint exists on GitHub while job is running, and ciphertext restored byte-for-byte."
      - name: Remove temporary verification prerelease and tag
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "hermes-checkpoint-smoketest" --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          Write-Host "Temporary verification release cleanup attempted."
