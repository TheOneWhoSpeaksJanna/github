name: Benchmark Selected Model Speed

on:
  workflow_dispatch:
  push:
    paths:
      - benchmark_selected.py

permissions:
  contents: write

jobs:
  benchmark-selected:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: 'C:\AI\Models'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_KEEP_ALIVE: '10m'
      CUDA_VISIBLE_DEVICES: '-1'
      HIP_VISIBLE_DEVICES: '-1'
      NO_PROXY: '127.0.0.1,localhost'
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Path "C:\AI\Models" -Force | Out-Null
          irm https://ollama.com/install.ps1 | iex
          $paths = @("$env:LOCALAPPDATA\Programs\Ollama", "$env:ProgramFiles\Ollama")
          $source = $paths | Where-Object {
            Test-Path (Join-Path $_ "ollama.exe")
          } | Select-Object -First 1
          if (-not $source) { throw "Ollama executable missing after installation" }
          New-Item -ItemType Directory "C:\Ollama" -Force | Out-Null
          Copy-Item -Path "$source\*" -Destination "C:\Ollama" -Recurse -Force
          Get-Process -Name ollama -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Ollama executable ready for speed benchmark"

      - name: Measure exact selected model and reference
        shell: powershell
        run: |
          python benchmark_selected.py

      - name: Commit measured results
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path "SELECTED_MODEL_SPEED.md")) {
            Write-Warning "No benchmark result was generated"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SELECTED_MODEL_SPEED.md SELECTED_MODEL_SPEED.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Record selected-model CPU speed measurements"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Push failed" }

      - name: Upload raw benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-model-speed
          path: |
            SELECTED_MODEL_SPEED.md
            SELECTED_MODEL_SPEED.json
            ollama-selected-benchmark.log
          if-no-files-found: ignore
