name: Verify Hermes 64K CPU context
on:
  push:
    paths:
      - .github/workflows/hermes-context-verify.yml
permissions:
  contents: read
jobs:
  context:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check model configuration and PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($p in @("scripts\hermes-bootstrap.ps1", "scripts\hermes-fast-server.ps1")) {
            $tok = $null
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tok,[ref]$err)
            if ($err.Count -gt 0) { $err | ForEach-Object { Write-Host $_.Message }; throw "Invalid PowerShell syntax: $p" }
          }
          if (-not ((Get-Content "scripts\hermes-fast-server.ps1" -Raw).Contains('@("model.ollama_num_ctx","65536")'))) {
            throw "Hermes must request 65536 num_ctx tokens"
          }
          python scripts/hermes-model-config.py selftest
          if ($LASTEXITCODE -ne 0) { throw "Model txt parser failed" }
      - name: Restore existing clean Ollama and Hermes cache
        uses: actions/cache/restore@v4
        with:
          key: hermes-win2022-pinned79b45d-mobile-v3-${{ hashFiles('hermes-models.txt') }}
          restore-keys: |
            hermes-win2022-pinned79b45d-mobile-v3-
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models
      - name: Prepare selected Ollama model and Hermes
        shell: powershell
        run: |
          & .\scripts\hermes-bootstrap.ps1
          if (-not $?) { throw "Hermes software preparation failed" }
      - name: Verify selected 1.5B model responds with 65536 context
        timeout-minutes: 6
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP "hermes"
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP "ollama-models"
          $env:OLLAMA_HOST = "127.0.0.1:11434"
          $env:OLLAMA_CONTEXT_LENGTH = "65536"
          $env:OLLAMA_NUM_PARALLEL = "1"
          $env:OLLAMA_MAX_LOADED_MODELS = "1"
          $env:CUDA_VISIBLE_DEVICES = "-1"
          $env:HIP_VISIBLE_DEVICES = "-1"
          $model = & python scripts/hermes-model-config.py default hermes-models.txt
          if ($LASTEXITCODE -ne 0) { throw "Selected model missing" }
          $ollama = Join-Path $env:RUNNER_TEMP "ollama-bin\ollama.exe"
          $serve = Start-Process -FilePath $ollama -ArgumentList "serve" -WindowStyle Hidden -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\ollama64.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\ollama64.stderr.log"
          for ($i=0; $i -lt 50; $i++) {
            try {
              $response = Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 3
              break
            } catch {
              if ($i -eq 49) { throw "Ollama did not start" }
              Start-Sleep -Seconds 2
            }
          }
          $body = @{
            model = $model
            stream = $false
            messages = @(@{ role="user"; content="Reply OK only." })
            options = @{ num_ctx = 65536; num_predict = 24; temperature = 0 }
          } | ConvertTo-Json -Depth 7
          $start = Get-Date
          try {
            $reply = Invoke-RestMethod "http://127.0.0.1:11434/api/chat" -ContentType "application/json" -Method POST -Body $body -TimeoutSec 250
          } catch {
            Get-Content "$env:RUNNER_TEMP\ollama64.stderr.log" -Tail 30
            throw
          }
          if (-not $reply.message.content) { throw "Model generated no answer at 65536 context" }
          $seconds = [math]::Round(((Get-Date)-$start).TotalSeconds,1)
          Write-Host "PASSED: selected Ollama model generated answer with num_ctx=65536 in $seconds seconds."
          Write-Host "Response length: $($reply.message.content.Length) characters."
          $hermes = Join-Path $env:HERMES_HOME "bin\hermes.exe"
          & $hermes config set model.default $model
          & $hermes config set model.provider custom
          & $hermes config set model.base_url "http://127.0.0.1:11434/v1"
          & $hermes config set model.context_length 65536
          & $hermes config set model.ollama_num_ctx 65536
          if ($LASTEXITCODE -ne 0) { throw "Hermes rejected 65536 Ollama request context" }
          Write-Host "PASSED: Hermes accepted context_length=65536 and ollama_num_ctx=65536."
          if (-not $serve.HasExited) { Stop-Process -Id $serve.Id -Force -ErrorAction SilentlyContinue }
      - name: Verify real Hermes agent responds with file tools at 65536 context
        timeout-minutes: 7
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP "hermes"
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP "ollama-models"
          $env:OLLAMA_HOST = "127.0.0.1:11434"
          $env:OLLAMA_CONTEXT_LENGTH = "65536"
          $env:OLLAMA_NUM_PARALLEL = "1"
          $env:OLLAMA_MAX_LOADED_MODELS = "1"
          $env:CUDA_VISIBLE_DEVICES = "-1"
          $env:HIP_VISIBLE_DEVICES = "-1"
          $env:NO_PROXY = "127.0.0.1,localhost"
          $ollama = Join-Path $env:RUNNER_TEMP "ollama-bin\ollama.exe"
          $hermes = Join-Path $env:HERMES_HOME "bin\hermes.exe"
          $serve = Start-Process -FilePath $ollama -ArgumentList "serve" -WindowStyle Hidden -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\ollama64-agents.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\ollama64-agents.stderr.log"
          for ($i=0; $i -lt 35; $i++) {
            try {
              Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 3 | Out-Null
              break
            } catch {
              if ($i -eq 34) { throw "Ollama did not start for real Hermes agent test" }
              Start-Sleep -Seconds 2
            }
          }
          $workspace = Join-Path $env:RUNNER_TEMP "HermesAgentTest"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          Push-Location $workspace
          try {
            $ErrorActionPreference = "Continue"
            $answer = & $hermes --oneshot "Reply with only the word OK. Do not use any tools." --toolsets file 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = "Stop"
            $trimmed = $answer.Trim()
            if ($exitCode -ne 0 -or -not $trimmed -or $trimmed -match "context window|could not start|Traceback|error:") {
              Write-Host "Hermes one-shot output (first 1000 chars): $($trimmed.Substring(0, [Math]::Min(1000, $trimmed.Length)))"
              throw "Hermes 65K test with file tools did not produce a valid answer"
            }
            Write-Host "PASSED: real Hermes one-shot agent with file tools produced a nonempty answer at configured 65536 context."
            Write-Host "Answer length: $($trimmed.Length) characters."
          } finally {
            Pop-Location
            if (-not $serve.HasExited) { Stop-Process -Id $serve.Id -Force -ErrorAction SilentlyContinue }
          }
