name: Stop retired File Agent VM
run-name: File agent stop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop:
    name: Request safe shutdown of old File Agent
    runs-on: ubuntu-latest
    steps:
      - name: Signal graceful shutdown
        run: |
          echo "Stop request sent. The old File Agent Windows job checks for this run in GitHub Actions, saves an encrypted snapshot and exits."
          echo "No new local model server is started by this workflow."
