name: Verify Codex Remote desktop setup safety
on:
  push:
    paths:
      - .github/workflows/verify-codex-remote.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check local setup script syntax and refuse CI login
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $file = "scripts/setup-codex-remote-windows.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Codex Remote Windows script has a parse error"
          }
          Write-Host "PASSED: local Windows script is syntactically valid"
          $env:GITHUB_ACTIONS = "true"
          $stderr = ""
          try {
            & .\scripts\setup-codex-remote-windows.ps1
            throw "FAILED: unattended GitHub Actions execution was permitted"
          } catch {
            $stderr = $_.Exception.Message
          }
          if ($stderr -notmatch "interactive signed-in desktop") {
            throw "FAILED: CI safeguard did not reject remote setup as expected"
          }
          Write-Host "PASSED: ephemeral GitHub Actions VM refuses automated ChatGPT login/pairing"
          if (-not (Test-Path "CODEX_ANDROID_SETUP.md")) {
            throw "Codex Android setup guide is missing"
          }
