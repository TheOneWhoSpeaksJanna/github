name: CPU Optimization Test - 1.5B vs 3B

on:
  workflow_dispatch:
  push:
    paths:
      - cpu_tune.py

permissions:
  contents: write

jobs:
  cpu-optimization:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: 'C:\AI\Models'
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama for CPU comparisons
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory "C:\AI\Models" -Force | Out-Null
          irm https://ollama.com/install.ps1 | iex
          $paths = @("$env:LOCALAPPDATA\Programs\Ollama","$env:ProgramFiles\Ollama")
          $source = $paths | Where-Object { Test-Path (Join-Path $_ "ollama.exe") } | Select-Object -First 1
          if (-not $source) { throw "Ollama executable missing" }
          New-Item -ItemType Directory "C:\Ollama" -Force | Out-Null
          Copy-Item "$source\*" "C:\Ollama" -Recurse -Force
          # Python starts and stops its own local server for each configuration.
          Get-Process -Name ollama -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Benchmark two coding models across CPU settings
        shell: powershell
        run: |
          python cpu_tune.py

      - name: Save tuning report to repository
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path "CPU_TUNING.md")) {
            Write-Host "Benchmark did not produce report"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CPU_TUNING.md CPU_TUNING.json
          if (Test-Path "selected-model.txt") { git add selected-model.txt }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Record tuned CPU speed and conditional model selection"
          if ($LASTEXITCODE -ne 0) { throw "Commit failed" }
          git push origin "HEAD:main"
          if ($LASTEXITCODE -ne 0) { throw "Could not push benchmark report" }

      - name: Upload tuning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-optimization-report
          path: |
            CPU_TUNING.md
            CPU_TUNING.json
          if-no-files-found: ignore
