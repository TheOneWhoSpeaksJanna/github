name: Verify mobile Hermes keyboard
on:
  push:
    paths:
      - .github/workflows/hermes-mobile-verify.yml
permissions:
  contents: read
jobs:
  mobile-composer:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover existing public runtime from GitHub cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: hermes-windows2022-pinned79b45d-qwen35-2b-mobile-v2
          restore-keys: |
            hermes-windows2022-pinned79b45d-qwen35-2b-v1
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models
      - name: Patch, typecheck and build mobile-native Hermes frontend
        shell: powershell
        run: |
          & .\scripts\hermes-bootstrap.ps1
          if (-not $?) { throw "Hermes Android frontend build failed" }
          $home = Join-Path $env:RUNNER_TEMP "hermes\hermes-agent"
          $source = Get-Content (Join-Path $home "web\src\pages\ChatPage.tsx") -Raw
          if (-not $source.Contains('HERME_ANDROID_COMPOSER_V1')) {
            throw "Mobile composer source was not patched"
          }
          if (-not (Test-Path (Join-Path $home "hermes_cli\web_dist\mobile-composer-v1.marker"))) {
            throw "Patched mobile dashboard was not successfully built"
          }
          $assets = Get-ChildItem (Join-Path $home "hermes_cli\web_dist\assets") -File -Filter "*ChatPage*.js"
          if (-not $assets) { throw "ChatPage production bundle missing" }
          $found = $false
          foreach ($asset in $assets) {
            if ((Get-Content $asset.FullName -Raw).Contains("Write a message using your Android keyboard")) {
              $found = $true
              break
            }
          }
          if (-not $found) { throw "Native mobile composer missing from bundled dashboard" }
          Write-Host "Hermes mobile textarea, Send button, and compiled production build verified."
      - name: Cache verified public runtime for normal Hermes launches
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: hermes-windows2022-pinned79b45d-qwen35-2b-mobile-v2
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models
