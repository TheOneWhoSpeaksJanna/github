name: Verify private Codex Remote VM
on:
  push:
    paths:
      - .github/workflows/codex-remote-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private device login/pairing page security and Windows launch syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & python -m unittest discover -s codex-remote -p "test_pair_portal.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Private pairing page failed security tests" }
          & python -m py_compile codex-remote/pair_portal.py
          if ($LASTEXITCODE -ne 0) { throw "Private page Python source does not compile" }
          foreach ($file in @("scripts\codex-remote-vm.ps1","scripts\file-agent-bootstrap.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell source invalid: $file"
            }
          }
          Write-Host "PASSED: private portal auth, code parsing, cross-origin safeguards and launch PowerShell syntax."
      - name: Validate official Codex CLI remote-control commands without account credentials
        shell: powershell
        run: |
          npm install -g @openai/codex@latest
          if ($LASTEXITCODE -ne 0) { throw "Codex CLI installation failed" }
          codex --version
          codex remote-control pair --help
          if ($LASTEXITCODE -ne 0) { throw "Remote manual pair command is missing" }
          codex login --help
          if ($LASTEXITCODE -ne 0) { throw "Codex device login command is unavailable" }
          Write-Host "PASSED: Codex CLI supports headless remote-control pairing and device-auth login."
