name: Verify selected Hermes model
on:
  push:
    paths:
      - .github/workflows/hermes-selected-verify.yml

permissions:
  contents: read

jobs:
  selected-model:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate selected model text
        shell: powershell
        run: |
          python scripts/hermes-model-config.py selftest
          if ($LASTEXITCODE -ne 0) { throw "Model configuration validation failed" }
          $models = @(python scripts/hermes-model-config.py list hermes-models.txt)
          if ($LASTEXITCODE -ne 0 -or $models.Count -ne 1) { throw "Expected one configured model for this test" }
          Write-Host "Configured Hermes model: $($models[0])"

      - name: Restore public Hermes and Ollama software cache
        id: runtime_cache
        uses: actions/cache/restore@v4
        with:
          key: hermes-win2022-pinned79b45d-mobile-v3-${{ hashFiles('hermes-models.txt') }}
          restore-keys: |
            hermes-win2022-pinned79b45d-mobile-v3-
            hermes-windows2022-pinned79b45d-qwen35-2b-mobile-v2
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models

      - name: Install selected model and prepare Hermes software
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\hermes-bootstrap.ps1
          if (-not $?) { throw "Failed to prepare selected Ollama model" }

      - name: Cache only clean public software and model
        if: steps.runtime_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: hermes-win2022-pinned79b45d-mobile-v3-${{ hashFiles('hermes-models.txt') }}
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models

      - name: Verify selected model actually generates a response
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP "ollama-models"
          $env:OLLAMA_HOST = "127.0.0.1:11434"
          $env:OLLAMA_CONTEXT_LENGTH = "8192"
          $env:CUDA_VISIBLE_DEVICES = "-1"
          $env:HIP_VISIBLE_DEVICES = "-1"
          $model = & python scripts/hermes-model-config.py default hermes-models.txt
          if ($LASTEXITCODE -ne 0) { throw "Cannot select test model" }
          $ollama = Join-Path $env:RUNNER_TEMP "ollama-bin\ollama.exe"
          $server = Start-Process -FilePath $ollama -ArgumentList "serve" -WindowStyle Hidden -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\ollama-selected.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\ollama-selected.stderr.log"
          for ($i=0; $i -lt 50; $i++) {
            try {
              $tags = Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 3
              $tag = if ($model.Contains(":")) { $model } else { "$($model):latest" }
              if (@($tags.models | Where-Object { $_.name -eq $tag }).Count -eq 0) { throw "Configured model is not installed" }
              break
            } catch {
              if ($i -eq 49) { throw "Ollama API or selected model unavailable" }
              Start-Sleep -Seconds 2
            }
          }
          $body = @{
            model = $model
            stream = $false
            options = @{ num_ctx=2048; num_predict=32; temperature=0 }
            messages = @(@{ role="user"; content="Reply with one word: OK" })
          } | ConvertTo-Json -Depth 6
          $started = Get-Date
          $reply = Invoke-RestMethod "http://127.0.0.1:11434/api/chat" -Method POST -ContentType "application/json" -Body $body -TimeoutSec 150
          if (-not $reply.message.content) { throw "Model returned no visible response" }
          Write-Host "PASSED: selected Ollama model generated text."
          Write-Host "Time elapsed: $([math]::Round(((Get-Date)-$started).TotalSeconds,1))s"
          Write-Host "Response length: $($reply.message.content.Length) characters"
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
