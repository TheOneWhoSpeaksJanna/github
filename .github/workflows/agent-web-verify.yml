name: Verify Android File Agent end-to-end
on:
  push:
    paths:
      - .github/workflows/agent-web-verify.yml
permissions:
  contents: read
jobs:
  private-web-file-agent:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify production Windows launch and restore script syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @("scripts\file-agent-server.ps1","scripts\file-agent-bootstrap.ps1","scripts\hermes-checkpoint.ps1")) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) { throw "Non-ASCII PowerShell source $file" }
            $tok = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tok,[ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell syntax error: $file"
            }
          }
          & python -m unittest discover -s agent -p "test_file_agent.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Filesystem and auth tests failed" }
          & python -m py_compile agent/file_agent.py agent/verify_web.py
          if ($LASTEXITCODE -ne 0) { throw "Syntax test failed" }
          Write-Host "PASSED: Windows launch, filesystem confinement, authentication, ZIP and syntax."

      - name: Restore public local model and Ollama runtime cache
        uses: actions/cache/restore@v4
        with:
          key: pocket-file-agent-v1-${{ hashFiles('agent-models.txt') }}
          restore-keys: |
            pocket-file-agent-v1-
          path: |
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models

      - name: Prepare cached local task model without private secrets
        shell: powershell
        run: |
          & .\scripts\file-agent-bootstrap.ps1
          if (-not $?) { throw "Ollama setup failed" }

      - name: Generate file through real password protected HTTP agent and download it
        shell: powershell
        timeout-minutes: 7
        env:
          OLLAMA_MODELS: ${{ runner.temp }}/ollama-models
        run: |
          $model = & python scripts/hermes-model-config.py default agent-models.txt
          & python agent/verify_web.py --ollama (Join-Path $env:RUNNER_TEMP "ollama-bin\ollama.exe") --model $model
          if ($LASTEXITCODE -ne 0) { throw "End-to-end private local agent file task failed" }
