name: Verify editable Hermes model list
on:
  push:
    paths:
      - .github/workflows/hermes-model-verify.yml
permissions:
  contents: read
jobs:
  verify-model:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test editable model file and PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/hermes-model-config.py selftest
          if ($LASTEXITCODE -ne 0) { throw "Hermes model file parser tests failed" }
          $default = python scripts/hermes-model-config.py default hermes-models.txt
          if ($LASTEXITCODE -ne 0) { throw "Default Hermes model is invalid" }
          Write-Host "Configured first model: $default"
          foreach ($file in @("scripts\hermes-bootstrap.ps1","scripts\hermes-fast-server.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw "Invalid PowerShell syntax in $file" }
          }
      - name: Restore cached binaries and models
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: hermes-win2022-pinned79b45d-mobile-v3-${{ hashFiles('hermes-models.txt') }}
          restore-keys: |
            hermes-win2022-pinned79b45d-mobile-v3-
            hermes-windows2022-pinned79b45d-qwen35-2b-mobile-v2
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models
      - name: Download selected Ollama model and test local API
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & .\scripts\hermes-bootstrap.ps1
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw "Hermes model/bootstrap setup failed" }
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP "ollama-models"
          $env:OLLAMA_HOST = "127.0.0.1:11434"
          $env:OLLAMA_CONTEXT_LENGTH = "8192"
          $model = python scripts/hermes-model-config.py default hermes-models.txt
          if ($LASTEXITCODE -ne 0) { throw "Cannot read selected model" }
          $ollama = Join-Path $env:RUNNER_TEMP "ollama-bin\ollama.exe"
          $server = Start-Process -FilePath $ollama -ArgumentList "serve" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\selected-ollama.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\selected-ollama.stderr.log"
          $ready = $false
          for ($i=0; $i -lt 45; $i++) {
            try {
              $r = Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 3
              $tag = if ($model.Contains(":")) { $model } else { "$($model):latest" }
              if (@($r.models | Where-Object { $_.name -eq $tag }).Count -eq 0) { throw "Model missing from Ollama tags: $model" }
              $ready = $true; break
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) { throw "Downloaded model unavailable through local Ollama" }
          $body = @{ model = $model; stream = $false; options = @{ num_ctx=8192; num_predict=20 }; messages = @(@{ role="user"; content="Reply with the word OK only." }) } | ConvertTo-Json -Depth 6
          $reply = Invoke-RestMethod "http://127.0.0.1:11434/api/chat" -Method POST -ContentType "application/json" -Body $body -TimeoutSec 150
          if (-not $reply.message.content) { throw "Selected model failed local response test" }
          Write-Host "Selected model $model responded via local API. Generation verified."
          Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
      - name: Cache clean Hermes runtime and newly installed model
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: hermes-win2022-pinned79b45d-mobile-v3-${{ hashFiles('hermes-models.txt') }}
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models
