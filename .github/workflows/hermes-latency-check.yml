name: Diagnose Hermes short-response latency
on:
  push:
    paths:
      - .github/workflows/hermes-latency-check.yml
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          key: hermes-win2022-pinned79b45d-mobile-v3-${{ hashFiles('hermes-models.txt') }}
          restore-keys: |
            hermes-win2022-pinned79b45d-mobile-v3-
          path: |
            ${{ runner.temp }}/hermes
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models
      - name: Prepare selected model and runtime
        shell: powershell
        run: |
          & .\scripts\hermes-bootstrap.ps1
          if (-not $?) { throw "Clean runtime unavailable" }
      - name: Measure default Hermes chat with configured model and 64K context
        timeout-minutes: 7
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP "hermes"
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP "ollama-models"
          $env:OLLAMA_HOST = "127.0.0.1:11434"
          $env:OLLAMA_CONTEXT_LENGTH = "65536"
          $env:OLLAMA_NUM_PARALLEL = "1"
          $env:OLLAMA_MAX_LOADED_MODELS = "1"
          $env:CUDA_VISIBLE_DEVICES = "-1"
          $env:HIP_VISIBLE_DEVICES = "-1"
          $env:NO_PROXY = "127.0.0.1,localhost"
          $ollama = Join-Path $env:RUNNER_TEMP "ollama-bin\ollama.exe"
          $hermes = Join-Path $env:HERMES_HOME "bin\hermes.exe"
          $model = python scripts/hermes-model-config.py default hermes-models.txt
          if ($LASTEXITCODE -ne 0) { throw "Selected model invalid" }
          $proc = Start-Process $ollama -ArgumentList "serve" -WindowStyle Hidden -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\latency-ollama.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\latency-ollama.stderr.log"
          for ($i=0; $i -lt 55; $i++) {
            try {
              Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 3 | Out-Null
              break
            } catch {
              if ($i -eq 54) { throw "Ollama could not start" }
              Start-Sleep -Seconds 2
            }
          }
          & $hermes config set model.default $model | Out-Null
          & $hermes config set model.provider custom | Out-Null
          & $hermes config set model.base_url "http://127.0.0.1:11434/v1" | Out-Null
          & $hermes config set model.context_length 65536 | Out-Null
          & $hermes config set model.ollama_num_ctx 65536 | Out-Null
          & $hermes config set approvals.mode manual | Out-Null
          & $hermes config set approvals.unattended_mode deny | Out-Null
          $testDir = Join-Path $env:RUNNER_TEMP "HermesLatencyTest"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          Push-Location $testDir
          try {
            $out = Join-Path $env:RUNNER_TEMP "hermes-latency.stdout.log"
            $err = Join-Path $env:RUNNER_TEMP "hermes-latency.stderr.log"
            $startTime = Get-Date
            $hermesProc = Start-Process -FilePath $hermes -ArgumentList @("--oneshot","Test") -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            if (-not $hermesProc.WaitForExit(240000)) {
              Stop-Process -Id $hermesProc.Id -Force -ErrorAction SilentlyContinue
              Write-Host "TIMEOUT: default Hermes did not answer the one-word Test prompt within 240 seconds."
              if (Test-Path $err) { Get-Content $err -Tail 14 | ForEach-Object { if ($_ -match 'context|timeout|failed|model|error') { Write-Host $_.Substring(0,[Math]::Min($_.Length,220)) } } }
              throw "Default Hermes simple chat response >240s. Ollama model may not be suitable for tool-enabled Hermes."
            }
            $seconds = [math]::Round(((Get-Date)-$startTime).TotalSeconds,1)
            $answer = if (Test-Path $out) { (Get-Content $out -Raw).Trim() } else { "" }
            Write-Host "Default Hermes elapsed seconds: $seconds"
            Write-Host "Exit code: $($hermesProc.ExitCode)"
            Write-Host "Output character count: $($answer.Length)"
            if ($hermesProc.ExitCode -ne 0 -or $answer.Length -lt 1) {
              if (Test-Path $err) { Get-Content $err -Tail 15 | ForEach-Object { if ($_ -match 'context|timeout|failed|model|error') { Write-Host $_.Substring(0,[Math]::Min($_.Length,220)) } } }
              throw "Hermes produced no answer"
            }
          } finally {
            Pop-Location
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
