name: Verify encrypted Hermes persistence
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/hermes_persist.py
      - .github/workflows/hermes-persist-test.yml
permissions:
  contents: read
jobs:
  backup-roundtrip:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test encryption, SQLite consistency and restoration
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check cryptography
          if ($LASTEXITCODE -ne 0) { throw "Could not install encryption library" }
          python scripts/hermes_persist.py selftest
          if ($LASTEXITCODE -ne 0) { throw "Backup and restore self-test failed" }
