name: Hermes Agent Windows CPU Compatibility Test
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hermes-smoke.yml
      - scripts/hermes-smoke.ps1
permissions:
  contents: read
jobs:
  hermes-smoke:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test isolated Hermes Agent with local tool-capable Ollama model
        shell: powershell
        run: |
          & .\scripts\hermes-smoke.ps1
      - name: Upload Hermes installation and tool-call test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-compatibility-logs
          path: ${{ runner.temp }}/hermes-test-logs/
          if-no-files-found: ignore
