name: Verify LIVE Pocket File Agent startup
on:
  push:
    paths:
      - .github/workflows/file-agent-live-verify.yml
permissions:
  contents: write
  actions: read

jobs:
  stop:
    name: Graceful Stop request
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "File agent Stop request registered. The active VM checks this signal every 40 seconds, saves encrypted files and exits normally."

  agent:
    name: Private file-creating local agent
    if: github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 350
    concurrency:
      group: pocket-file-agent-private-smoketest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate file sandbox, mobile downloads and server scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & python -m unittest discover -s agent -p "test_file_agent.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Agent sandbox/auth/ZIP tests failed" }
          & python -m py_compile agent/file_agent.py
          if ($LASTEXITCODE -ne 0) { throw "Agent source has syntax errors" }
          foreach ($file in @("scripts\file-agent-bootstrap.ps1","scripts\file-agent-server.ps1","scripts\hermes-checkpoint.ps1")) {
            $data = [IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            if (@($data | Where-Object { $_ -gt 127 }).Count -gt 0) { throw "Non-ASCII PowerShell source: $file" }
            $tok = $null; $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tok,[ref]$err)
            if ($err.Count -gt 0) { throw "Invalid Windows PowerShell syntax: $file" }
          }
          & python scripts/hermes-model-config.py list agent-models.txt
          if ($LASTEXITCODE -ne 0) { throw "Bad model list" }

      - name: Restore cached public Ollama engine and models
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: pocket-file-agent-v1-${{ hashFiles('agent-models.txt') }}
          restore-keys: |
            pocket-file-agent-v1-
            hermes-win2022-pinned79b45d-mobile-v3-
          path: |
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models

      - name: Prepare selected standard CPU model
        shell: powershell
        run: |
          & .\scripts\file-agent-bootstrap.ps1
          if (-not $?) { throw "Cannot prepare Ollama agent model" }

      - name: Cache only public binaries and model before secrets
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: pocket-file-agent-v1-${{ hashFiles('agent-models.txt') }}
          path: |
            ${{ runner.temp }}/ollama-bin
            ${{ runner.temp }}/ollama-models

      - name: Install AES-GCM cryptography and verify encrypted recovery
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check cryptography
          if ($LASTEXITCODE -ne 0) { throw "Could not install backup encryption" }
          & python scripts/hermes_persist.py selftest
          if ($LASTEXITCODE -ne 0) { throw "Encrypted backup recovery failed" }

      - name: Restore latest previously encrypted agent workspace
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_DASHBOARD_PASSWORD: ${{ secrets.HERMES_DASHBOARD_PASSWORD }}
        run: |
          $ErrorActionPreference = "Continue"
          $raw = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/file-agent-encrypted-checkpoints" 2>$null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"
          if (-not $exists) {
            Write-Host "No prior file-agent backup release; creating a fresh workspace."
            exit 0
          }
          $release = ($raw | Out-String) | ConvertFrom-Json
          $latest = $release.assets | Where-Object { $_.name -like "hermes-state-*.enc" } | Sort-Object created_at -Descending | Select-Object -First 1
          if (-not $latest) { Write-Host "No earlier file-agent workspace saved."; exit 0 }
          $folder = Join-Path $env:RUNNER_TEMP "FileAgentRestore"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          & gh release download "file-agent-encrypted-checkpoints" --repo $env:GITHUB_REPOSITORY --pattern $latest.name --dir $folder
          if ($LASTEXITCODE -ne 0) { throw "Cannot retrieve previous encrypted file workspace" }
          $home = Join-Path $env:RUNNER_TEMP "FileAgentState"
          $workspace = Join-Path $env:RUNNER_TEMP "FileAgentWorkspace"
          $enc = Join-Path $folder $latest.name
          & python scripts/hermes_persist.py restore --home $home --workspace $workspace --file $enc
          if ($LASTEXITCODE -ne 0) { throw "Encrypted workspace could not be restored; keep the existing password" }
          Write-Host "Recovered previous encrypted file-agent workspace."

      - name: Connect private authenticated Tailscale network
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if (-not $env:TS_AUTHKEY) { throw "Set TAILSCALE_AUTHKEY repository secret" }
          $msi = "$env:TEMP\tailscale-agent.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          $installer = Start-Process msiexec.exe -ArgumentList @("/i",$msi,"/quiet","/norestart") -Wait -PassThru
          if ($installer.ExitCode -notin @(0,3010)) { throw "Tailscale installation failed" }
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TS_AUTHKEY" --hostname="file-agent-$env:GITHUB_RUN_ID" --unattended
          if ($LASTEXITCODE -ne 0) { throw "Tailscale authentication failed" }
          $ip = (& $ts ip -4 | Select-Object -First 1)
          if (-not $ip -or $ip -notmatch '^100\.') { throw "Private Tailscale IP unavailable" }
          Write-Host "::add-mask::$ip"
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Private Tailscale connection active."

      - name: Keep file agent online, encrypt every 10 min and stop gracefully
        timeout-minutes: 330
        shell: powershell
        env:
          HERMES_DASHBOARD_PASSWORD: ${{ secrets.HERMES_DASHBOARD_PASSWORD }}
          AGENT_SESSION_MINUTES: "2"
          GH_TOKEN: ${{ github.token }}
        run: |
          & .\scripts\file-agent-server.ps1
          if (-not $?) { throw "Private file agent ended unexpectedly" }

      - name: Upload final encrypted file workspace backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-agent-state-${{ github.run_id }}
          path: ${{ runner.temp }}/file-agent-state.enc
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
